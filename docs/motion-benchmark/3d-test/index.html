<!doctype html>
<!-- Botly 3D speed test: a 6 s Three.js shot driven by HyperFrames' hf-seek (no clock, no requestAnimationFrame).
     Needs assets/gsap.min.js (from scripts/tools/promo/template/) and assets/three.module.min.js (three@0.170.0). -->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ground: #07080b; --ink: #f1f4f8; --mint: #7cf0c4; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, system-ui, sans-serif; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #title { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; color: var(--ink);
               font-size: 88px; font-weight: 600; letter-spacing: -0.03em; opacity: 0; }
      #title b { color: var(--mint); font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <canvas id="stage" class="clip" data-start="0" data-duration="6" data-track-index="0"></canvas>
      <h1 id="title" class="clip" data-start="0" data-duration="6" data-track-index="1">Meet <b>Botly</b></h1>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#title', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 3.4);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
    <script type="module">
      import * as THREE from './assets/three.module.min.js';

      const canvas = document.getElementById('stage');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#07080b');
      const camera = new THREE.PerspectiveCamera(32, 1920 / 1080, 0.1, 100);

      // The product: a dark server box with a mint light strip.
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 1.0, 1.4, 1, 1, 1),
        new THREE.MeshStandardMaterial({ color: '#15181e', metalness: 0.7, roughness: 0.32 }),
      );
      body.castShadow = true;
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 0.05, 0.02),
        new THREE.MeshStandardMaterial({ color: '#7cf0c4', emissive: '#7cf0c4', emissiveIntensity: 2.2 }),
      );
      strip.position.set(0, -0.18, 0.71);
      const product = new THREE.Group();
      product.add(body, strip);
      product.position.y = 0.5;
      scene.add(product);

      // Floor that only shows the soft contact shadow.
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.55 }));
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      // Warm key, cool rim, dim fill.
      const key = new THREE.DirectionalLight('#ffe2c4', 3.2);
      key.position.set(3, 4, 3);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.radius = 6;
      const rim = new THREE.DirectionalLight('#9fd8ff', 2.4);
      rim.position.set(-4, 2.5, -3);
      scene.add(key, rim, new THREE.HemisphereLight('#2a2f3a', '#050608', 0.6));

      const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

      // Every frame comes from t alone: no clock, no requestAnimationFrame.
      function renderAt(t) {
        const p = ease(t / 6);
        product.rotation.y = -0.9 + p * 1.25;            // a slow, decelerating turn
        camera.position.set(Math.sin(0.35 - p * 0.35) * 6.2, 1.6 + (1 - p) * 0.6, Math.cos(0.35 - p * 0.35) * 6.2);
        camera.lookAt(0, 0.55, 0);
        key.position.x = 3 - p * 5;                       // the light sweeps across the face
        strip.material.emissiveIntensity = 0.4 + 2.2 * ease((t - 0.8) / 1.6);
        renderer.render(scene, camera);
      }
      window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
      renderAt(0);
    </script>
  </body>
</html>
