<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      @font-face { font-family: 'Display'; font-weight: 600; src: url('fonts/montserrat-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Display'; font-weight: 800; src: url('fonts/montserrat-latin-800-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Display'; font-weight: 900; src: url('fonts/montserrat-latin-900-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Body'; font-weight: 500; src: url('fonts/inter-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Body'; font-weight: 700; src: url('fonts/inter-latin-700-normal.woff2') format('woff2'); }
      :root { --ink: #fff; --bg: #060b1d; --accent: #19c3f3; --accent2: #8af04a; --deep: #0b1f4b; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Body', sans-serif; }

      .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
      .bg { position: absolute; inset: -60px; background-size: cover; background-position: center; will-change: transform; }
      .shade { position: absolute; inset: 0; background:
        linear-gradient(180deg, rgba(4,8,22,.78) 0%, rgba(4,8,22,.25) 30%, rgba(4,8,22,.35) 58%, rgba(4,8,22,.92) 100%); }
      .shade.heavy { background: linear-gradient(180deg, rgba(4,8,22,.88) 0%, rgba(4,8,22,.62) 45%, rgba(4,8,22,.95) 100%); }
      .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(90px); opacity: .55; }
      .solid { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 0%, var(--deep) 0%, var(--bg) 70%); }

      .content { position: absolute; left: 80px; right: 80px; top: 300px; height: 1060px; display: flex; flex-direction: column; justify-content: center; gap: 34px; }
      .content.top { justify-content: flex-start; padding-top: 40px; }
      .kicker { align-self: flex-start; padding: 14px 28px; border-radius: 999px; background: var(--accent); color: #031021; font: 800 30px/1 'Display'; letter-spacing: .14em; text-transform: uppercase; }
      .title { font: 900 120px/1.02 'Display'; letter-spacing: -.035em; text-wrap: balance; overflow-wrap: anywhere; text-shadow: 0 8px 40px rgba(0,0,0,.45); }
      .title .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .02em .06em 0; margin-bottom: -.06em; }
      .title .w > span { display: inline-block; }
      .title .hl { color: var(--accent); }
      .bar { width: 180px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transform-origin: left center; }
      .sub { font: 500 46px/1.3 'Body'; color: rgba(255,255,255,.88); max-width: 900px; }

      .points { display: flex; flex-direction: column; gap: 26px; }
      .point { display: flex; align-items: center; gap: 28px; padding: 30px 34px; border-radius: 30px; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.18); font: 700 48px/1.2 'Body'; }
      .check { flex: 0 0 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #031021; font: 900 36px/1 'Display'; }

      .plans { display: flex; flex-direction: column; gap: 26px; }
      .plan { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 20px; padding: 34px 40px; border-radius: 34px; background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,255,255,.16); }
      .plan.pop { background: linear-gradient(135deg, rgba(25,195,243,.30), rgba(138,240,74,.18)); border-color: var(--accent); box-shadow: 0 20px 80px rgba(25,195,243,.35); }
      .plan .name { font: 800 52px/1.1 'Display'; }
      .plan .price { grid-row: span 2; text-align: right; font: 900 104px/1 'Display'; letter-spacing: -.03em; }
      .plan .price small { font: 600 30px/1 'Body'; opacity: .75; letter-spacing: 0; }
      .plan .feat { font: 500 34px/1.3 'Body'; color: rgba(255,255,255,.82); }
      .plan .badge { position: absolute; top: -22px; left: 40px; padding: 10px 20px; border-radius: 999px; background: var(--accent2); color: #031021; font: 800 24px/1 'Display'; letter-spacing: .1em; text-transform: uppercase; }

      .cta { align-items: center; text-align: center; }
      .cta .title { font-size: 112px; }
      .logo { max-width: 520px; max-height: 220px; object-fit: contain; filter: drop-shadow(0 10px 40px rgba(0,0,0,.4)); }
      .brandname { font: 900 64px/1 'Display'; letter-spacing: -.02em; }
      .button { position: relative; overflow: hidden; padding: 38px 76px; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #031021; font: 900 54px/1 'Display'; box-shadow: 0 24px 80px rgba(25,195,243,.45); }
      .button .shine { position: absolute; top: -20%; bottom: -20%; width: 120px; left: -160px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-20deg); }
      .url { padding: 18px 34px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.2); font: 700 40px/1 'Body'; }

      #captions { position: absolute; left: 60px; right: 60px; top: 1450px; height: 230px; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 20; }
      .chunk { position: absolute; left: 0; right: 0; text-align: center; visibility: hidden; font: 900 76px/1.12 'Display'; letter-spacing: -.01em; text-transform: uppercase;
        text-shadow: 0 4px 0 rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.6); -webkit-text-stroke: 2px rgba(0,0,0,.35); }
      .chunk .cw { display: inline-block; margin: 0 .12em; padding: .06em .18em; border-radius: 18px; }
      .chunk .cw.on { background: var(--accent); color: #031021; text-shadow: none; -webkit-text-stroke: 0; }

      #progress { position: absolute; top: 70px; left: 60px; right: 60px; display: flex; gap: 10px; z-index: 30; }
      #progress .seg { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.28); overflow: hidden; }
      #progress .fill { height: 100%; width: 100%; background: #fff; transform-origin: left center; transform: scaleX(0); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 40; pointer-events: none; }
      #leak { position: absolute; width: 1400px; height: 1400px; left: -900px; top: 200px; border-radius: 50%; z-index: 25; pointer-events: none; opacity: 0;
        background: radial-gradient(circle, rgba(255,190,120,.55) 0%, rgba(255,120,80,.25) 35%, transparent 70%); mix-blend-mode: screen; }
      #grain { position: absolute; inset: -100px; z-index: 35; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920" data-fps="30">
      <div id="scenes"></div>
      <div id="captions"></div>
      <div id="progress"></div>
      <div id="leak"></div>
      <div id="grain"></div>
      <div id="flash"></div>
      <!--AUDIO-->
    </div>
    <script src="gsap.min.js"></script>
    <script src="spec.js"></script>
    <script src="engine.js"></script>
  </body>
</html>
